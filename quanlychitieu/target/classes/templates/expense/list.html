<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Quản lý chi tiêu</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">

</head>

<body>

	<div class="container mt-5">

		<h2 class="mb-4 text-primary">Danh sách khoản chi</h2>

		<a href="/expenses/add" class="btn btn-success mb-3"> Thêm khoản
			chi </a>

		<table class="table table-bordered table-hover">

			<thead class="table-dark">

				<tr>
					<th>ID</th>
					<th>Tên khoản chi</th>
					<th>Số tiền</th>
					<th>Ngày</th>
					<th>Ghi chú</th>
					<th>Thao tác</th>
				</tr>

			</thead>

			<tbody>

				<tr th:each="e : ${expenses}">

					<td th:text="${e.id}"></td>

					<td th:text="${e.title}"></td>

					<td th:text="${e.category.name}"></td>

					<td th:text="${e.amount}"></td>

					<td th:text="${e.expenseDate}"></td>

					<td th:text="${e.note}"></td>

					<td><a th:href="@{/expenses/delete/{id}(id=${e.id})}"
						class="btn btn-danger btn-sm"
						onclick="return confirm('Bạn có chắc muốn xóa?')"> Xóa </a></td>
						
					<td><a th:href="@{/expenses/edit/{id}(id=${e.id})}"
						class="btn btn-warning btn-sm"> Sửa </a></td>

				</tr>

			</tbody>

		</table>

	</div>

</body>
</html>
