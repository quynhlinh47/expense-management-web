<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Dashboard</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body{
            overflow-x: hidden;
            background: #f4f6f9;
        }

        .sidebar{
            width:250px;
            height:100vh;
            position:fixed;
            background:#212529;
            color:white;
        }

        .sidebar a{
            color:white;
            text-decoration:none;
            display:block;
            padding:15px;
            transition:0.3s;
        }

        .sidebar a:hover{
            background:#0d6efd;
        }

        .content{
            margin-left:250px;
            padding:20px;
        }

        .card-dashboard{
            border:none;
            border-radius:15px;
            box-shadow:0 4px 10px rgba(0,0,0,0.1);
        }

    </style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <h3 class="text-center py-4">
        Expense Manager
    </h3>

    <a href="/dashboard">
        <i class="bi bi-house"></i>
        Dashboard
    </a>

    <a href="/expenses">
        <i class="bi bi-wallet2"></i>
        Quản lý chi tiêu
    </a>

    <a href="#">
        <i class="bi bi-bar-chart"></i>
        Thống kê
    </a>

    <a href="#">
        <i class="bi bi-person"></i>
        Tài khoản
    </a>

</div>

<!-- CONTENT -->

<div class="content">

    <div class="container-fluid">

        <h2 class="mb-4">
            Dashboard
        </h2>

        <div class="row">

            <!-- CARD 1 -->

            <div class="col-md-4">

                <div class="card card-dashboard bg-primary text-white">

                    <div class="card-body">

                        <h5>Tổng chi tiêu</h5>

                        <h2><span th:text="${totalExpense}"></span> VNĐ</h2>

                    </div>

                </div>

            </div>

            <!-- CARD 2 -->

            <div class="col-md-4">

                <div class="card card-dashboard bg-success text-white">

                    <div class="card-body">

                        <h5>Khoản chi tháng này</h5>

                        <h2><span th:text="${expenseCount}"></span></h2>

                    </div>

                </div>

            </div>

            <!-- CARD 3 -->

            <div class="col-md-4">

                <div class="card card-dashboard bg-danger text-white">

                    <div class="card-body">

                        <h5>Danh mục</h5>

                        <h2> <span th:text="${categoryCount}"></span></h2>

                    </div>

                </div>

            </div>

        </div>

        <!-- TABLE -->

        <div class="card mt-5 card-dashboard">

            <div class="card-body">

                <h4>Khoản chi gần đây</h4>

                <table class="table table-hover mt-3">

                    <thead>

                    <tr>
                        <th>Tên</th>
                        <th>Số tiền</th>
                        <th>Ngày</th>
                    </tr>

                    </thead>

                    <tbody>

                    <tr th:each="e : ${recentExpenses}">

                        <td th:text="${e.title}"></td>

                        <td th:text="${e.amount}"></td>

                        <td th:text="${e.category.name}"></td>

                        <td th:text="${e.expenseDate}"></td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
