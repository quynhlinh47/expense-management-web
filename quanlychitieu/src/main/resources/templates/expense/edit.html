<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Sửa khoản chi</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2 class="mb-4 text-warning">

            Sửa khoản chi

        </h2>

        <form
            th:action="@{/expenses/save}"
            method="post"
            th:object="${expense}">

            <input
                type="hidden"
                th:field="*{id}">

            <!-- TITLE -->

            <div class="mb-3">

                <label>Tên khoản chi</label>

                <input
                    type="text"
                    th:field="*{title}"
                    class="form-control">

            </div>

            <!-- AMOUNT -->

            <div class="mb-3">

                <label>Số tiền</label>

                <input
                    type="number"
                    th:field="*{amount}"
                    class="form-control">

            </div>

            <!-- DATE -->

            <div class="mb-3">

                <label>Ngày chi</label>

                <input
                    type="date"
                    th:field="*{expenseDate}"
                    class="form-control">

            </div>

            <!-- NOTE -->

            <div class="mb-3">

                <label>Ghi chú</label>

                <textarea
                    th:field="*{note}"
                    class="form-control">
                </textarea>

            </div>

            <!-- CATEGORY -->

            <div class="mb-3">

                <label>Danh mục</label>

                <select
                    th:field="*{category}"
                    class="form-select">

                    <option
                        th:each="c : ${categories}"
                        th:value="${c.id}"
                        th:text="${c.name}">
                    </option>

                </select>

            </div>

            <button class="btn btn-primary">

                Cập nhật

            </button>

        </form>

    </div>

</div>

</body>
</html>
