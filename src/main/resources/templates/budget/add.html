<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Thêm ngân sách</title>

    <meta charset="UTF-8">

    <!-- BOOTSTRAP -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- ICON -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>

        body{
            background:#f8fafc;
            overflow-x:hidden;
        }

        /* =========================
           CONTENT
        ========================== */

        .content{
            margin-left:260px;
            padding:24px;
            background:#f8fafc;
            min-height:100vh;
        }

        /* =========================
           FORM CARD
        ========================== */

        .form-card{

            border:none;

            border-radius:20px;

            background:white;

            max-width:700px;

            margin:0 auto;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.06);
        }

        /* =========================
           TITLE
        ========================== */

        .page-title{
            font-size:1.35rem;
            font-weight:700;
            color:#1e293b;
        }

        /* =========================
           FORM LABEL
        ========================== */

        .form-label{

            font-size:0.95rem;

            font-weight:600;

            color:#64748b;

            margin-bottom:8px;
        }

        /* =========================
           INPUT
        ========================== */

        .form-control,
        .form-select{

            border-radius:12px;

            border:1.5px solid #e2e8f0;

            padding:12px 14px;

            font-size:0.95rem;

            transition:all .2s ease;
        }

        .form-control:focus,
        .form-select:focus{

            border-color:#6366f1;

            box-shadow:
                0 0 0 3px rgba(99,102,241,.15);
        }

        /* =========================
           BUTTON
        ========================== */

        .btn{

            border-radius:12px;

            padding:11px 20px;

            font-size:0.95rem;

            font-weight:500;
        }

        .btn-primary{

            background:#6366f1;

            border:none;
        }

        .btn-primary:hover{

            background:#4f46e5;
        }

        .btn-light{

            border:1px solid #e2e8f0;

            background:white;
        }

        .btn-light:hover{

            background:#f8fafc;
        }

    </style>

</head>

<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- CONTENT -->
<div class="content">

    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid px-3">

        <!-- FORM -->
        <div class="form-card p-5">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4">

                <div>

                    <h4 class="page-title mb-1">
                        Thêm ngân sách mới
                    </h4>

                    <p class="text-muted mb-0">
                        Thiết lập giới hạn chi tiêu theo danh mục
                    </p>

                </div>

                <a href="/budgets"
                   class="btn btn-light">

                    <i class="bi bi-arrow-left me-2"></i>

                    Quay lại

                </a>

            </div>

            <!-- FORM -->
            <form
                th:action="@{/budgets/save}"
                method="post"
                th:object="${budget}">

                <!-- CATEGORY -->
                <div class="mb-4">

                    <label class="form-label">

                        Danh mục

                    </label>

                    <select
                        th:field="*{category.id}"
                        class="form-select">

                        <option value="">
                            -- Chọn danh mục --
                        </option>

                        <option
                            th:each="c : ${categories}"

                            th:value="${c.id}"

                            th:text="${c.name}">
                        </option>

                    </select>

                </div>

                <!-- LIMIT -->
                <div class="mb-4">

                    <label class="form-label">

                        Giới hạn chi tiêu (VNĐ)

                    </label>

                    <input
                        type="number"

                        th:field="*{limitAmount}"

                        class="form-control"

                        placeholder="Ví dụ: 5000000">

                </div>

                <!-- BUTTON -->
                <div class="d-flex gap-3">

                    <button
                        type="submit"
                        class="btn btn-primary flex-fill">

                        <i class="bi bi-save me-2"></i>

                        Lưu ngân sách

                    </button>

                    <a href="/budgets"
                       class="btn btn-light flex-fill">

                        Hủy

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
