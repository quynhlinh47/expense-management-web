<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm thu nhập</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        .content {
            margin-left: 260px;
            padding: 24px;
            background: #f8fafc;
            min-height: 100vh;
        }

        .form-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            background: white;
            max-width: 680px;
            margin: 0 auto;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            font-size: 0.95rem;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            padding: 10px 14px;
        }

        .form-control:focus, .form-select:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .btn-success {
            border-radius: 10px;
            padding: 10px 24px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- CONTENT -->
<div class="content">
    
    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid px-3">
        
        <div class="form-card p-5">
            
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h5 class="mb-0 fw-semibold text-dark">Thêm thu nhập mới</h5>
                <a href="/incomes" class="btn btn-light">
                    <i class="bi bi-arrow-left me-2"></i> Quay lại
                </a>
            </div>

            <form th:action="@{/incomes/save}" method="post" th:object="${income}">
                
                <!-- Tên thu nhập -->
                <div class="mb-4">
                    <label class="form-label">Tên thu nhập</label>
                    <input type="text" 
                           th:field="*{title}" 
                           class="form-control" 
                           placeholder="Ví dụ: Lương tháng 5, Tiền thưởng...">
                </div>

                <!-- Số tiền -->
                <div class="mb-4">
                    <label class="form-label">Số tiền (VNĐ)</label>
                    <div class="input-group">
                        <input type="number" 
                               th:field="*{amount}" 
                               class="form-control">
                        <span class="input-group-text">VNĐ</span>
                    </div>
                </div>

                <!-- Danh mục -->
                <div class="mb-4">
                    <label class="form-label">Danh mục</label>
                    <select th:field="*{category.id}" class="form-select">
                        <option value="">-- Chọn danh mục --</option>
                        <option th:each="c : ${categories}" 
                                th:value="${c.id}" 
                                th:text="${c.name}">
                        </option>
                    </select>
                </div>

                <!-- Ngày nhận -->
                <div class="mb-4">
                    <label class="form-label">Ngày nhận</label>
                    <input type="date" 
                           th:field="*{incomeDate}" 
                           class="form-control">
                </div>

                <!-- Ghi chú -->
                <div class="mb-4">
                    <label class="form-label">Ghi chú</label>
                    <textarea th:field="*{note}" 
                              class="form-control" 
                              rows="4"
                              placeholder="Ghi chú thêm..."></textarea>
                </div>

                <!-- Buttons -->
                <div class="d-flex gap-3">
                    <button type="submit" class="btn btn-success flex-fill">
                        <i class="bi bi-save me-2"></i> Lưu thu nhập
                    </button>
                    <a href="/incomes" class="btn btn-light flex-fill">Hủy</a>
                </div>
                
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
