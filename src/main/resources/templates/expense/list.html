<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý chi tiêu</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        .content {
            margin-left: 260px;
            padding: 24px;
            background: #f8fafc;
            min-height: 100vh;
        }

        .modern-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .filter-bar {
            background: white;
            border-radius: 14px;
            padding: 16px 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .modern-table {
            font-size: 0.95rem;
        }
        
        .modern-table th {
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
            background: #f8fafc;
            padding: 16px 12px;
        }
        
        .modern-table td {
            padding: 14px 12px;
            vertical-align: middle;
        }

        .amount {
            font-weight: 700;
            color: #e11d48;
        }

        .action-buttons {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            opacity: 0;
            transition: all 0.3s ease;
        }

        tr:hover .action-buttons {
            opacity: 1;
        }

        .btn-sm {
            width: 34px;
            height: 34px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- CONTENT -->
<div class="content">
    
    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid px-3">
        
        <!-- Filter Bar -->
        <div class="filter-bar">
            <div class="row g-3 align-items-end">
                
                <!-- Tiêu đề + Bộ lọc -->
                <div class="col-12 col-lg-3">
                   
                    <h5 class="text-muted">Tổng số khoản chi: <strong th:text="${#lists.size(expenses)}"></strong></h5>
                </div>

                <!-- Lọc thời gian -->
                <div class="col-12 col-md-4 col-lg-3">
                    <label class="form-label small text-muted mb-1">Từ ngày</label>
                    <input type="date" class="form-control" id="startDate" th:value="${startDate}">
                </div>
                
                <div class="col-12 col-md-4 col-lg-3">
                    <label class="form-label small text-muted mb-1">Đến ngày</label>
                    <input type="date" class="form-control" id="endDate" th:value="${endDate}">
                </div>

                <!-- Lọc danh mục -->
                <div class="col-12 col-md-4 col-lg-3">
                    <label class="form-label small text-muted mb-1">Danh mục</label>
                    <select class="form-select" id="categoryFilter">
                        <option value="">Tất cả danh mục</option>
                        <option th:each="cat : ${categories}" 
                                th:value="${cat.id}" 
                                th:text="${cat.name}"
                                th:selected="${cat.id == categoryId}"></option>
                    </select>
                </div>

                <!-- Sắp xếp -->
                <div class="col-12 col-md-4 col-lg-3">
                    <label class="form-label small text-muted mb-1">Sắp xếp</label>
                    <select class="form-select" id="sortFilter">
                        <option value="newest">Mới nhất</option>
                        <option value="oldest">Cũ nhất</option>
                        <option value="amount-desc">Số tiền cao → thấp</option>
                        <option value="amount-asc">Số tiền thấp → cao</option>
                    </select>
                </div>

                <!-- Nút hành động -->
                <div class="col-12 col-lg-3 d-flex gap-2">
                    <button onclick="applyFilters()" class="btn btn-primary flex-fill">
                        <i class="bi bi-funnel"></i> Áp dụng
                    </button>
                    <a href="/expenses" class="btn btn-outline-secondary flex-fill">
                        <i class="bi bi-arrow-counterclockwise"></i> Reset
                    </a>
                </div>
            </div>
        </div>

        <!-- Nút Thêm -->
        <div class="d-flex justify-content-end mb-3">
            <a href="/expenses/add" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i> Thêm khoản chi mới
            </a>
        </div>

        <!-- Bảng dữ liệu -->
        <div class="modern-card">
            <div class="card-body p-0">
                <table class="table table-hover modern-table mb-0">
                    <thead>
                        <tr>
                            <th>Tên khoản chi</th>
                            <th>Số tiền</th>
                            <th>Danh mục</th>
                            <th>Ngày</th>
                            <th>Ghi chú</th>
                            <th style="width: 90px;"></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${expenses}">
                            <td class="fw-medium" th:text="${e.title}"></td>
                            <td class="amount">
                                <span th:text="${#numbers.formatDecimal(e.amount, 0, 'COMMA', 0, 'POINT')}"></span> ₫
                            </td>
                            <td th:text="${e.category?.name}"></td>
                            <td th:text="${#temporals.format(e.expenseDate, 'dd/MM/yyyy')}"></td>
                            <td th:text="${e.note}" class="text-muted small"></td>
                            
                            <td class="position-relative">
                                <div class="action-buttons">
                                    <a th:href="@{/expenses/edit/{id}(id=${e.id})}" 
                                       class="btn btn-outline-primary btn-sm me-1">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                    <button class="btn btn-outline-danger btn-sm"
                                            data-bs-toggle="modal"
                                            data-bs-target="#deleteModal"
                                            th:attr="data-id=${e.id}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-semibold">Xác nhận xóa</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Bạn có chắc chắn muốn xóa khoản chi này không?
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Hủy</button>
                <a id="confirmDeleteBtn" href="#" class="btn btn-danger px-4">Xóa</a>
            </div>
        </div>
    </div>
</div>

<script>
    function applyFilters() {
        const startDate = document.getElementById('startDate').value;
        const endDate = document.getElementById('endDate').value;
        const category = document.getElementById('categoryFilter').value;
        const sort = document.getElementById('sortFilter').value;

        let url = '/expenses?';
        if (startDate) url += 'startDate=' + startDate + '&';
        if (endDate) url += 'endDate=' + endDate + '&';
        if (category) url += 'categoryId=' + category + '&';
        if (sort) url += 'sort=' + sort;

        window.location.href = url;
    }

    // DELETE MODAL
    const deleteModal = document.getElementById('deleteModal');
    deleteModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const id = button.getAttribute('data-id');
        document.getElementById('confirmDeleteBtn').href = '/expenses/delete/' + id;
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
