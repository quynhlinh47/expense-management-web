<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tài khoản</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        .content {
            margin-left: 260px;
            padding: 24px;
            background: #f8fafc;
            min-height: 100vh;
        }

        .profile-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            background: white;
        }

        .form-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            background: white;
        }

        .form-label {
            font-size: 0.9rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            font-size: 0.95rem;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            padding: 10px 14px;
        }

        .form-control:focus, .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .avatar {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- CONTENT -->
<div class="content">
    
    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid px-3">
        
        <h5 class="fw-semibold text-dark mb-4">Tài khoản cá nhân</h5>

        <div class="row g-4">
            
            <!-- LEFT: Profile -->
            <div class="col-lg-4">
                <div class="profile-card p-4 text-center">
                    <div class="mx-auto mb-3">
                        <img th:src="${user.avatar != null ? user.avatar : '/images/default-avatar.png'}"
                             class="avatar rounded-circle" alt="Avatar">
                    </div>
                    <h5 class="fw-bold mb-1" th:text="${user.fullName}"></h5>
                    <p class="text-muted small" th:text="${user.email}"></p>
                    
                    <div class="mt-3">
                        <span class="badge bg-success px-3 py-2">
                            <i class="bi bi-check-circle-fill"></i> Hoạt động
                        </span>
                    </div>

                    <hr class="my-4">
                    
                    <div class="text-start small">
                        <p class="mb-2">
                            <i class="bi bi-calendar-event text-primary"></i> 
                            Ngày tham gia: <strong th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}"></strong>
                        </p>
                        <p>
                            <i class="bi bi-globe text-success"></i> 
                            Múi giờ: <strong th:text="${user.timezone}"></strong>
                        </p>
                    </div>
                </div>
            </div>

            <!-- RIGHT: Forms -->
            <div class="col-lg-8">
                
                <!-- Thông tin cá nhân -->
                <div class="form-card p-4 mb-4">
                    <h5 class="fw-semibold mb-4">
                        <i class="bi bi-person-lines-fill"></i> Thông tin cá nhân
                    </h5>
                    
                    <form th:action="@{/account/save}" method="post" enctype="multipart/form-data" th:object="${user}">
                        <input type="hidden" th:field="*{id}">

                        <!-- Avatar Upload -->
                        <div class="mb-4 text-center">
                            <img th:src="${user.avatar != null ? user.avatar : '/images/default-avatar.png'}"
                                 class="avatar rounded-circle mb-3" alt="Avatar">
                            <input type="file" name="avatarFile" class="form-control d-inline-block w-auto">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Họ và tên</label>
                                <input type="text" th:field="*{fullName}" class="form-control">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" th:field="*{email}" class="form-control">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Đơn vị tiền tệ</label>
                                <select th:field="*{currency}" class="form-select">
                                    <option value="VND">VNĐ</option>
                                    <option value="USD">USD</option>
                                    <option value="EUR">EUR</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Múi giờ</label>
                                <select th:field="*{timezone}" class="form-select">
                                    <option value="Asia/Ho_Chi_Minh">Việt Nam (Asia/Ho_Chi_Minh)</option>
                                    <option value="Asia/Tokyo">Nhật Bản</option>
                                    <option value="America/New_York">Mỹ</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-save me-2"></i> Lưu thay đổi
                        </button>
                    </form>
                </div>

                <!-- Đổi mật khẩu -->
                <div class="form-card p-4">
                    <h5 class="fw-semibold mb-4">
                        <i class="bi bi-key-fill"></i> Đổi mật khẩu
                    </h5>

                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>

                    <form th:action="@{/account/change-password}" method="post">
                        <input type="hidden" name="userId" th:value="${user.id}">

                        <div class="mb-3">
                            <label class="form-label">Mật khẩu hiện tại</label>
                            <input type="password" name="oldPassword" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Mật khẩu mới</label>
                            <input type="password" name="newPassword" class="form-control" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Xác nhận mật khẩu mới</label>
                            <input type="password" name="confirmPassword" class="form-control" required>
                        </div>

                        <button type="submit" class="btn btn-warning text-white px-4">
                            <i class="bi bi-arrow-repeat me-2"></i> Cập nhật mật khẩu
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
