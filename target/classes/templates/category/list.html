<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        .content {
            margin-left: 260px;
            padding: 24px;
            background: #f8fafc;
            min-height: 100vh;
        }

        .modern-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .modern-table {
            font-size: 0.95rem;
        }
        
        .modern-table th {
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
            background: #f8fafc;
            padding: 16px 12px;
        }
        
        .modern-table td {
            padding: 14px 12px;
            vertical-align: middle;
            color: #334155;
        }

        .action-buttons {
            opacity: 0;
            transition: all 0.3s ease;
        }

        tr:hover .action-buttons {
            opacity: 1;
        }

        .btn-sm {
            width: 38px;
            height: 38px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- CONTENT -->
<div class="content">
    
    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid px-3">
        
        <!-- Alerts -->
        <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${success}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="${error}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            
            <a href="/categories/add" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i> Thêm danh mục
            </a>
        </div>

        <!-- Table -->
        <div class="modern-card">
            <div class="card-body p-0">
                <table class="table table-hover modern-table mb-0">
                    <thead>
                        <tr>
                            <th>Tên danh mục</th>
                            <th>Loại</th>
                            <th style="width: 80px; text-align: center;">Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${categories}">
                            <td class="fw-medium" th:text="${c.name}"></td>
                            <td>
                                <span class="badge" 
                                      th:classappend="${c.type == 'EXPENSE'} ? 'bg-danger' : 'bg-success'">
                                    [[${c.type}]]
                                </span>
                            </td>
                            <td class="text-center position-relative">
                                <div class="action-buttons">
                                    <button class="btn btn-outline-danger btn-sm"
                                            data-bs-toggle="modal"
                                            data-bs-target="#deleteModal"
                                            th:attr="data-id=${c.id},data-name=${c.name}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header border-0">
                <h5 class="modal-title fw-semibold">Xác nhận xóa</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                Bạn có chắc muốn xóa danh mục 
                <strong id="categoryName"></strong> ?
            </div>
            <div class="modal-footer border-0">
                <button type="button" class="btn btn-light px-4" data-bs-dismiss="modal">Hủy</button>
                <a id="confirmDeleteBtn" href="#" class="btn btn-danger px-4">
                    <i class="bi bi-trash me-2"></i> Xóa
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    const deleteModal = document.getElementById('deleteModal');
    deleteModal.addEventListener('show.bs.modal', function (event) {
        const button = event.relatedTarget;
        const id = button.getAttribute('data-id');
        const name = button.getAttribute('data-name');
        
        document.getElementById('categoryName').innerText = name;
        document.getElementById('confirmDeleteBtn').href = '/categories/delete/' + id;
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
