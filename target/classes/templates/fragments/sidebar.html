<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

<div th:fragment="sidebar">

    <div class="sidebar">

        <h3 class="text-center text-white py-4">
            Expense Manager
        </h3>

        <a href="/dashboard"
   th:classappend="${pageTitle == 'Dashboard'} ? 'active-menu'">

    <i class="bi bi-house"></i>
    Dashboard

</a>

        <a href="/expenses"
   th:classappend="${pageTitle.contains('chi tiêu')} ? 'active-menu'">

    <i class="bi bi-wallet2"></i>
    Quản lý chi tiêu

</a>

       <a href="/incomes"
   th:classappend="${pageTitle.contains('Thu nhập')} ? 'active-menu'">

    <i class="bi bi-cash-stack"></i>
    Thu nhập

</a>

<a href="/budgets"
   th:classappend="${pageTitle != null and pageTitle.contains('Ngân sách')} ? 'active-menu'">

    <i class="bi bi-cash-stack"></i>
    Ngân sách

</a>

<a href="/categories"
   th:classappend="${pageTitle != null and pageTitle.contains('Danh mục')} ? 'active-menu'">

    <i class="bi bi-tags"></i>
    Danh mục

</a>

        <a href="/statistics"
   th:classappend="${pageTitle == 'Thống kê'} ? 'active-menu'">

    <i class="bi bi-bar-chart"></i>
    Thống kê

</a>
<a href="/account"
th:classappend="${pageTitle != null and pageTitle.contains('Tài khoản')} ? 'active-menu'">
        <i class="bi bi-person-circle"></i>
        Tài khoản
    </a>
    </div>

</div>

</body>
</html>
