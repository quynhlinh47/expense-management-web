<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
        :root {
            --soft-primary: #6366f1;
            --soft-income: #34d399;
            --soft-expense: #f87171;
            --soft-balance: #60a5fa;
        }

        .content {
            margin-left: 260px;
            padding: 24px;
            background: #f8fafc;
            min-height: 100vh;
        }

        /* Stat Cards - Màu nhẹ nhàng */
        .stat-card {
            border: none;
            border-radius: 16px;
            padding: 8px 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        .card-expense { 
            background: linear-gradient(135deg, #fee2e2, #fecaca); 
            color: #b91c1c; 
        }
        .card-income  { 
            background: linear-gradient(135deg, #d1fae5, #a7f3d0); 
            color: #166534; 
        }
        .card-balance { 
            background: linear-gradient(135deg, #dbeafe, #bfdbfe); 
            color: #1e40af; 
        }
        .card-count   { 
            background: linear-gradient(135deg, #f3e8ff, #e0d4ff); 
            color: #5b21b6; 
        }

        .stat-card h5 {
            font-size: 0.95rem;
            font-weight: 500;
            margin-bottom: 6px;
        }
        
        .stat-card h3 {
            font-size: 1.65rem;     /* Chữ nhỏ hơn */
            font-weight: 700;
            margin: 0;
        }

        /* Table */
        .modern-table {
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        
        .modern-table th {
            font-size: 0.9rem;
            font-weight: 600;
            color: #64748b;
            padding: 14px 12px;
        }
        
        .modern-table td {
            font-size: 0.95rem;
            padding: 14px 12px;
            vertical-align: middle;
        }

        .amount {
            font-weight: 700;
            color: #e11d48;
        }
    </style>
</head>
<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- CONTENT -->
<div class="content">
    
    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid px-3">
        
        <div class="row g-4">
            
            <!-- Tổng chi tiêu -->
            <div class="col-md-4">
                <div class="stat-card card-expense">
                    <div class="card-body p-0">
                        <h5><i class="bi bi-arrow-down-circle me-2"></i>Tổng chi tiêu</h5>
                        <h3>
                            <span th:text="${#numbers.formatDecimal(totalExpense, 0, 'COMMA', 0, 'POINT')}"></span> ₫
                        </h3>
                    </div>
                </div>
            </div>

            <!-- Tổng thu nhập -->
            <div class="col-md-4">
                <div class="stat-card card-income">
                    <div class="card-body p-0">
                        <h5><i class="bi bi-arrow-up-circle me-2"></i>Tổng thu nhập</h5>
                        <h3>
                            <span th:text="${#numbers.formatDecimal(totalIncome, 0, 'COMMA', 0, 'POINT')}"></span> ₫
                        </h3>
                    </div>
                </div>
            </div>

            <!-- Số dư -->
            <div class="col-md-4">
                <div class="stat-card card-balance">
                    <div class="card-body p-0">
                        <h5><i class="bi bi-wallet2 me-2"></i>Số dư hiện tại</h5>
                        <h3>
                            <span th:text="${#numbers.formatDecimal(balance, 0, 'COMMA', 0, 'POINT')}"></span> ₫
                        </h3>
                    </div>
                </div>
            </div>

            <!-- Khoản chi tháng này -->
            <div class="col-md-6">
                <div class="stat-card card-count">
                    <div class="card-body p-0">
                        <h5><i class="bi bi-receipt me-2"></i>Khoản chi tháng này</h5>
                        <h3 th:text="${expenseCount}"></h3>
                    </div>
                </div>
            </div>

            <!-- Danh mục -->
            <div class="col-md-6">
                <div class="stat-card card-count">
                    <div class="card-body p-0">
                        <h5><i class="bi bi-tags me-2"></i>Danh mục</h5>
                        <h3 th:text="${categoryCount}"></h3>
                    </div>
                </div>
            </div>

        </div>

        <!-- Bảng khoản chi gần đây -->
        <div class="card mt-5 modern-table">
            <div class="card-header bg-white py-3 border-0">
                <h5 class="mb-0 fw-semibold text-dark">Khoản chi gần đây</h5>
            </div>
            <div class="card-body p-0">
                <table class="table table-hover mb-0 modern-table">
                    <thead>
                        <tr>
                            <th>Tên khoản chi</th>
                            <th>Số tiền</th>
                            <th>Danh mục</th>
                            <th>Ngày</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="e : ${recentExpenses}">
                            <td class="fw-medium" th:text="${e.title}"></td>
                            <td class="amount">
                                <span th:text="${#numbers.formatDecimal(e.amount, 0, 'COMMA', 0, 'POINT')}"></span> ₫
                            </td>
                            <td th:text="${e.category?.name}"></td>
                            <td th:text="${#temporals.format(e.expenseDate, 'dd/MM/yyyy')}"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
