<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Đăng nhập</title>
    <meta charset="UTF-8">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        .login-wrapper {
            min-height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            border: none;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 35px rgba(99, 102, 241, 0.12);
            padding: 40px;
        }

        .logo-circle {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
        }

        .logo-circle i {
            font-size: 2rem;
            color: white;
        }

        .login-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
        }

        .login-subtitle {
            color: #64748b;
            font-size: 0.95rem;
        }

        .form-label {
            font-size: 0.92rem;
            font-weight: 500;
            color: #475569;
            margin-bottom: 8px;
        }

        .form-control {
            height: 50px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            padding-left: 42px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .input-group-custom {
            position: relative;
        }

        .input-group-custom i {
            position: absolute;
            top: 50%;
            left: 14px;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1rem;
            z-index: 10;
        }

        .btn-login {
            height: 50px;
            border-radius: 12px;
            background: linear-gradient(135deg, #6366f1, #818cf8);
            border: none;
            font-size: 1rem;
            font-weight: 600;
            transition: 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(99, 102, 241, 0.25);
        }

        .register-link {
            color: #6366f1;
            font-weight: 500;
            text-decoration: none;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.08);
            z-index: -1;
        }

        .shape-1 {
            width: 250px;
            height: 250px;
            top: -60px;
            left: -80px;
        }

        .shape-2 {
            width: 180px;
            height: 180px;
            bottom: -40px;
            right: -40px;
        }
    </style>
</head>

<body>

    <!-- Background Shapes -->
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>

    <div class="container">
        <div class="row justify-content-center align-items-center login-wrapper">

            <div class="col-lg-5 col-md-7">

                <div class="login-card">

                    <!-- Logo -->
                    <div class="logo-circle">
                        <i class="bi bi-wallet2"></i>
                    </div>

                    <!-- Title -->
                    <div class="text-center mb-4">
                        <h2 class="login-title">Đăng nhập</h2>
                        <p class="login-subtitle">
                            Quản lý chi tiêu dễ dàng và thông minh
                        </p>
                    </div>

                    <!-- Form -->
                    <form th:action="@{/login}" method="post">

                        <!-- Email -->
                        <div class="mb-4">
                            <label class="form-label">
                                Email
                            </label>

                            <div class="input-group-custom">
                                <i class="bi bi-envelope"></i>

                                <input
                                        type="email"
                                        name="username"
                                        class="form-control"
                                        placeholder="Nhập email của bạn">
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-4">
                            <label class="form-label">
                                Mật khẩu
                            </label>

                            <div class="input-group-custom">
                                <i class="bi bi-lock"></i>

                                <input
                                        type="password"
                                        name="password"
                                        class="form-control"
                                        placeholder="Nhập mật khẩu">
                            </div>
                        </div>

                        <!-- Button -->
                        <button class="btn btn-primary btn-login w-100">
                            <i class="bi bi-box-arrow-in-right me-2"></i>
                            Đăng nhập
                        </button>

                    </form>

                    <!-- Register -->
                    <div class="text-center mt-4">
                        <span class="text-muted">
                            Chưa có tài khoản?
                        </span>

                        <a href="/register" class="register-link">
                            Đăng ký ngay
                        </a>
                    </div>

                </div>

            </div>

        </div>
    </div>

</body>
</html>
