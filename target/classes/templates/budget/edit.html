<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Sửa ngân sách</title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ICON -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .content {
            margin-left: 260px;
            padding: 24px;
            background: #f8fafc;
            min-height: 100vh;
        }

        .form-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            background: white;
            max-width: 680px;
            margin: 0 auto;
        }

        .form-label {
            font-size: 0.95rem;
            font-weight: 500;
            color: #64748b;
            margin-bottom: 6px;
        }

        .form-control,
        .form-select {
            font-size: 0.95rem;
            border-radius: 10px;
            border: 1.5px solid #e2e8f0;
            padding: 10px 14px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .btn {
            border-radius: 10px;
            padding: 10px 24px;
            font-size: 0.95rem;
        }

        .page-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1e293b;
        }
    </style>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- CONTENT -->
<div class="content">

    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid px-3">

        <div class="form-card p-5">

            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                
                <h5 class="page-title mb-0">
                    Chỉnh sửa ngân sách
                </h5>

                <a href="/budgets" class="btn btn-light">
                    <i class="bi bi-arrow-left me-2"></i>
                    Quay lại
                </a>

            </div>

            <!-- FORM -->
            <form
                    th:action="@{/budgets/save}"
                    method="post"
                    th:object="${budget}">

                <!-- ID -->
                <input
                        type="hidden"
                        th:field="*{id}">

                <!-- DANH MỤC -->
                <div class="mb-4">

                    <label class="form-label">
                        Danh mục
                    </label>

                    <select
                            th:field="*{category.id}"
                            class="form-select">

                        <option value="">
                            -- Chọn danh mục --
                        </option>

                        <option
                                th:each="c : ${categories}"
                                th:value="${c.id}"
                                th:text="${c.name}">
                        </option>

                    </select>

                </div>

                <!-- GIỚI HẠN -->
                <div class="mb-4">

                    <label class="form-label">
                        Giới hạn chi tiêu (VNĐ)
                    </label>

                    <input
                            type="number"
                            th:field="*{limitAmount}"
                            class="form-control"
                            placeholder="Nhập số tiền giới hạn">

                </div>

                <!-- BUTTON -->
                <div class="d-flex gap-3">

                    <button
                            type="submit"
                            class="btn btn-warning text-white flex-fill">

                        <i class="bi bi-pencil-square me-2"></i>
                        Cập nhật ngân sách

                    </button>

                    <a href="/budgets"
                       class="btn btn-light flex-fill">

                        Hủy

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
