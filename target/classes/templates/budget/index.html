<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ngân sách</title>
    <meta charset="UTF-8">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ICON -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>

        :root{
            --primary:#6366f1;
            --success:#22c55e;
            --danger:#ef4444;
            --bg:#f8fafc;
        }

        body{
            background:var(--bg);
            overflow-x:hidden;
            font-size:16px;
        }

        /* =========================
           CONTENT
        ========================== */

        .content{
            margin-left:260px;
            padding:24px;
            background:var(--bg);
            min-height:100vh;
        }

        /* =========================
           PAGE HEADER
        ========================== */


        .page-subtitle{
            color:#64748b;
            font-size:1rem;
        }

        /* =========================
           CARD
        ========================== */

        .card{
            border:none;
            border-radius:20px;
            background:#fff;

            padding:28px !important;

            box-shadow:
                0 4px 20px rgba(0,0,0,0.06);

            transition:all .3s ease;
        }

        .card:hover{
            transform:translateY(-5px);

            box-shadow:
                0 10px 30px rgba(0,0,0,0.08);
        }

        /* =========================
           CATEGORY TITLE
        ========================== */

        h4{
            font-size:1.4rem;
            font-weight:700;
            color:#1e293b;
            margin-bottom:6px;
        }

        .text-muted{
            color:#64748b !important;
            font-size:1rem;
        }

        /* =========================
           ACTION BUTTON
        ========================== */

        .action-btn{

            width:42px;
            height:42px;

            display:inline-flex;
            align-items:center;
            justify-content:center;

            border-radius:12px;

            font-size:1.1rem;

            transition:.25s ease;

            text-decoration:none;
        }

        .edit-btn{
            background:#eef2ff;
            color:#4f46e5;
        }

        .edit-btn:hover{
            background:#6366f1;
            color:white;
            transform:scale(1.08);
        }

        .delete-btn{
            background:#fee2e2;
            color:#dc2626;
        }

        .delete-btn:hover{
            background:#ef4444;
            color:white;
            transform:scale(1.08);
        }

        /* =========================
           INFO
        ========================== */

        .budget-info{
            font-size:1rem;
            margin-bottom:14px;
        }

        .budget-percent{
            font-size:1rem;
            font-weight:600;
        }

        /* =========================
           PROGRESS
        ========================== */

        .progress{
            height:14px;
            border-radius:20px;
            background:#e5e7eb;
            overflow:hidden;
        }

        .progress-bar{
            border-radius:20px;
            transition:width .6s ease;
        }

        /* =========================
           ALERT
        ========================== */

        .alert{
            border:none;
            border-radius:12px;
            font-size:0.95rem;
        }

        /* =========================
           BUTTON
        ========================== */

        .btn-primary{
            background:#6366f1;
            border:none;

            padding:12px 20px;
            border-radius:12px;

            font-size:1rem;
            font-weight:600;
        }

        .btn-primary:hover{
            background:#4f46e5;
        }

        /* =========================
           MODAL
        ========================== */

        .modal-content{
            border:none;
            border-radius:20px;
        }

        .modal-header{
            border:none;
        }

        .modal-footer{
            border:none;
        }

    </style>
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- CONTENT -->
<div class="content">

    <!-- NAVBAR -->
    <div th:replace="fragments/navbar :: navbar"></div>

    <div class="container-fluid px-3">

        <!-- HEADER -->
        <div class="d-flex justify-content-between align-items-center mb-5">

            <div>

                <p class="page-subtitle mb-0">
                    Theo dõi giới hạn chi tiêu của bạn
                </p>
            </div>

            <a href="/budgets/add" class="btn btn-primary">
                <i class="bi bi-plus-circle me-2"></i>
                Thêm ngân sách
            </a>

        </div>

        <!-- LIST -->
        <div class="row g-4">

            <div class="col-md-6 col-lg-4"
                 th:each="b : ${budgets}">

                <div class="card">

                    <!-- HEADER -->
                    <div class="d-flex justify-content-between align-items-start mb-4">

                        <div>

                            <h4 th:text="${b.category.name}"></h4>

                            <p class="text-muted mb-0">

                                Giới hạn:

                                <strong
                                  th:text="${#numbers.formatDecimal(b.limitAmount,0,'COMMA',0,'POINT')} + ' VNĐ'">
                                </strong>

                            </p>

                        </div>

                        <!-- ACTION -->
                        <div class="d-flex gap-2">

                            <a th:href="@{/budgets/edit/{id}(id=${b.id})}"
                               class="action-btn edit-btn">

                                <i class="bi bi-pencil"></i>

                            </a>

                            <button
                                class="action-btn delete-btn border-0"

                                data-bs-toggle="modal"

                                data-bs-target="#deleteBudgetModal"

                                th:attr="data-id=${b.id}">

                                <i class="bi bi-trash"></i>

                            </button>

                        </div>

                    </div>

                    <!-- PROGRESS -->
                    <div th:with="
                         spent=${b.category.totalSpent != null ? b.category.totalSpent : 0},
                         percent=${b.limitAmount > 0 ? (spent * 100 / b.limitAmount) : 0}
                    ">

                        <!-- INFO -->
                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <div class="budget-info">

                                Đã dùng:

                                <strong
                                  th:text="${#numbers.formatDecimal(spent,0,'COMMA',0,'POINT')}">
                                </strong>

                                VNĐ

                            </div>

                            <div class="budget-percent"
                                 th:text="${#numbers.formatDecimal(percent,0,0)} + '%'">
                            </div>

                        </div>

                        <!-- PROGRESS -->
                        <div class="progress">

                            <div class="progress-bar"

                                 th:classappend="${percent > 100}
                                 ? 'bg-danger'
                                 : 'bg-success'"

                                 th:style="'width:' + ${percent > 100 ? 100 : percent} + '%'">

                            </div>

                        </div>

                        <!-- ALERT -->
                        <div th:if="${percent > 100}"
                             class="alert alert-danger mt-4">

                            ⚠ Đã vượt ngân sách!

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- DELETE MODAL -->

<div class="modal fade"
     id="deleteBudgetModal"
     tabindex="-1">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header bg-danger text-white">

                <h5 class="modal-title">
                    Xác nhận xóa
                </h5>

                <button type="button"
                        class="btn-close btn-close-white"
                        data-bs-dismiss="modal">
                </button>

            </div>

            <div class="modal-body">

                Bạn có chắc muốn xóa ngân sách này không?

            </div>

            <div class="modal-footer">

                <button type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                    Hủy

                </button>

                <a id="confirmDeleteBudgetBtn"
                   href="#"
                   class="btn btn-danger">

                    Xóa

                </a>

            </div>

        </div>

    </div>

</div>

<script>

    const deleteBudgetModal =
        document.getElementById('deleteBudgetModal');

    deleteBudgetModal.addEventListener(
        'show.bs.modal',

        function(event){

            const button =
                event.relatedTarget;

            const id =
                button.getAttribute('data-id');

            const deleteBtn =
                document.getElementById(
                    'confirmDeleteBudgetBtn'
                );

            deleteBtn.href =
                '/budgets/delete/' + id;
        }
    );

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
