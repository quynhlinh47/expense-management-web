<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thống kê</title>
    <meta charset="UTF-8">

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- ICON -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- CHART -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    
    <style>
       
.content {
            margin-left: 260px;
            padding: 24px;
            background: #f8fafc;
            min-height: 100vh;
        }
        .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            background-color: #ffffff;
        }
        .card-dashboard {
            transition: all 0.3s ease;
        }
        .card-dashboard:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }
        h5, h6 {
            font-size: 0.95rem;
            font-weight: 500;
            color: #495057;
        }
        h3 {
            font-size: 1.55rem;
            font-weight: 600;
        }
        .text-muted {
            font-size: 0.8rem;
        }
        .table {
            font-size: 0.85rem;
        }
        .table th {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .bi {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <!-- SIDEBAR -->
    <div th:replace="fragments/sidebar :: sidebar"></div>

    <!-- CONTENT -->
    <div class="content">
        <!-- NAVBAR -->
        <div th:replace="fragments/navbar :: navbar"></div>

        <div class="container-fluid py-4">
            <!-- DASHBOARD CARDS -->
            <div class="row g-4 mb-5">
                <!-- TOTAL EXPENSE -->
                <div class="col-md-4">
                    <div class="card card-dashboard p-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Tổng chi tiêu</h6>
                                <h3 class="fw-bold text-danger mb-0"
                                    th:text="${#numbers.formatDecimal(totalExpense,0,'COMMA',0,'POINT')} + ' VNĐ'">
                                </h3>
                            </div>
                            <i class="bi bi-cash-stack fs-1 text-danger"></i>
                        </div>
                    </div>
                </div>

                <!-- TOTAL TRANSACTIONS -->
                <div class="col-md-4">
                    <div class="card card-dashboard p-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Các khoản chi</h6>
                                <h3 class="fw-bold mb-0" th:text="${expenseCount}"></h3>
                            </div>
                            <i class="bi bi-receipt fs-1 text-primary"></i>
                        </div>
                    </div>
                </div>

                <!-- CATEGORIES -->
                <div class="col-md-4">
                    <div class="card card-dashboard p-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="text-muted mb-1">Danh mục</h6>
                                <h3 class="fw-bold mb-0" th:text="${#lists.size(categories)}"></h3>
                            </div>
                            <i class="bi bi-tags fs-1 text-success"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- CHARTS -->
            <div class="row g-4">
                <!-- LINE CHART -->
                <div class="col-12">
                    <div class="card p-4">
                        <h5 class="mb-4">
                            <i class="bi bi-graph-up me-2"></i>
                            Thu và chi theo tháng
                        </h5>
                        <canvas id="lineChart" height="180"></canvas>
                    </div>
                </div>

                <!-- BAR + PIE -->
                <div class="col-lg-8">
                    <div class="card p-4">
                        <h5 class="mb-4">
                            <i class="bi bi-bar-chart me-2"></i>
                            Chi tiêu theo khoản
                        </h5>
                        <canvas id="barChart" height="280"></canvas>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card p-4">
                        <h5 class="mb-4">
                            <i class="bi bi-pie-chart me-2"></i>
                            Theo danh mục
                        </h5>
                        <canvas id="pieChart" height="100"></canvas>
                    </div>
                </div>
            </div>

            <!-- RECENT TRANSACTIONS -->
            <div class="card p-4 mt-4">
                <h5 class="mb-4">
                    <i class="bi bi-clock-history me-2"></i>
                    Giao dịch gần đây
                </h5>
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Tên khoản chi</th>
                                <th>Danh mục</th>
                                <th>Số tiền</th>
                                <th>Ngày</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="e : ${expenses}">
                                <td th:text="${e.title}"></td>
                                <td th:text="${e.category.name}"></td>
                                <td class="text-danger fw-bold"
                                    th:text="${#numbers.formatDecimal(e.amount,0,'COMMA',0,'POINT')} + ' VNĐ'">
                                </td>
                                <td th:text="${#temporals.format(e.expenseDate, 'dd/MM/yyyy')}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script th:inline="javascript">

document.addEventListener("DOMContentLoaded", function () {

    const expenseTitles =
        /*[[${expenseTitles}]]*/ [];

    const expenseAmounts =
        /*[[${expenseAmounts}]]*/ [];

    const categoryNames =
        /*[[${categoryNames}]]*/ [];

    const categoryTotals =
        /*[[${categoryTotals}]]*/ [];

    const monthlyExpenseData =
        /*[[${monthlyExpenseData}]]*/ [];

    const monthlyIncomeData =
        /*[[${monthlyIncomeData}]]*/ [];

    // ================= LINE =================

    const lineCtx =
        document.getElementById('lineChart');

    if(lineCtx){

        new Chart(lineCtx, {

            type: 'line',

            data: {

                labels: [
                    'T1','T2','T3','T4',
                    'T5','T6','T7','T8',
                    'T9','T10','T11','T12'
                ],

                datasets: [

                    {
                        label: 'Thu nhập',

                        data: monthlyIncomeData,

                        borderColor: '#22c55e',

                        backgroundColor:
                            'rgba(34,197,94,0.1)',

                        fill: true,

                        tension: 0.4
                    },

                    {
                        label: 'Chi tiêu',

                        data: monthlyExpenseData,

                        borderColor: '#ef4444',

                        backgroundColor:
                            'rgba(239,68,68,0.1)',

                        fill: true,

                        tension: 0.4
                    }
                ]
            }
        });
    }

    // ================= BAR =================

    const barCtx =
        document.getElementById('barChart');

    if(barCtx){

        new Chart(barCtx, {

            type: 'bar',

            data: {

                labels: expenseTitles,

                datasets: [{

                    label: 'Chi tiêu',

                    data: expenseAmounts,

                    backgroundColor: '#6366f1',

                    borderRadius: 8
                }]
            }
        });
    }

    // ================= PIE =================

    const pieCtx =
        document.getElementById('pieChart');

    if(pieCtx){

        new Chart(pieCtx, {

            type: 'pie',

            data: {

                labels: categoryNames,

                datasets: [{

                    data: categoryTotals,

                    backgroundColor: [

                        '#6366f1',
                        '#34d399',
                        '#f59e0b',
                        '#ef4444',
                        '#8b5cf6',
                        '#06b6d4'
                    ]
                }]
            }
        });
    }

});

</script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
